<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoSniper Dashboard</title>
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    
    <!-- Header -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    <span class="font-bold text-xl tracking-tight text-white">AlgoSniper</span>
                </div>
                <div class="text-xs text-slate-400">
                    Last Updated: 2026-08-13 17:07:36 AEST
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- PnL Cards -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-sm flex flex-col items-center justify-center">
                <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wide mb-1">Unrealized P&L</h2>
                <div class="text-4xl font-bold text-green-500">
                    $0.00
                </div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-sm flex flex-col items-center justify-center">
                <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wide mb-1">Realized P&L (Today)</h2>
                <div class="text-4xl font-bold text-green-500">
                    $0.00
                </div>
            </div>
        </section>

        <!-- Current Open Positions -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-semibold text-white">Active Positions (0)</h2>
                <span class="px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-sm font-medium">Max 4</span>
            </div>
            
            
            <div class="bg-slate-800 rounded-2xl p-12 border border-slate-700 text-center">
                <svg class="w-16 h-16 text-slate-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <h3 class="text-lg font-medium text-slate-300">No Open Positions</h3>
                <p class="text-slate-500 mt-1">The sniper is waiting for the perfect setup.</p>
            </div>
            
        </section>

        <!-- Trade History (Last 30 Days) -->
        <section>
            <h2 class="text-2xl font-semibold text-white mb-4">Trade History (Last 30 Days)</h2>
            <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-900/50 text-slate-400 uppercase tracking-wider">
                            <tr>
                                <th class="px-6 py-4 font-medium">Date</th>
                                <th class="px-6 py-4 font-medium">Symbol</th>
                                <th class="px-6 py-4 font-medium">Action</th>
                                <th class="px-6 py-4 font-medium">Price</th>
                                <th class="px-6 py-4 font-medium">RSI</th>
                                <th class="px-6 py-4 font-medium">SMA</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">
                            
                            
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-slate-500">No history available yet.</td>
                            </tr>
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        
    </main>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
